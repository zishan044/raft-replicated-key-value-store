name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # 02:00 Asia/Dhaka

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        run: make tools
      - name: Check M1 (includes 500 simulation seeds)
        run: make check
      - name: Nightly simulation campaign
        if: github.event_name == 'schedule'
        run: make sim SEEDS=20000
