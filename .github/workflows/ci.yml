name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # 02:00 Asia/Dhaka

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '30s' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        run: make tools
      - name: Check M3 (500 seeds per campaign, boundary tests and decoder fuzzing)
        run: make check

  nightly-simulation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [sim, sim-crash]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run 20,000 uncached seeds
        run: make ${{ matrix.target }} SEEDS=20000
