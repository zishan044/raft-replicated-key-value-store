syntax = "proto3";

package raft.v1;

option go_package = "github.com/zishan044/raft-replicated-key-value-store.git/pkg/api/raft/v1;raftv1";

// MessageType identifies messages in the peer protocol.
enum MessageType {
  // Leader contact now uses empty AppendEntries.
  reserved 5;
  reserved "MESSAGE_TYPE_HEARTBEAT";

  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_PRE_VOTE = 1;
  MESSAGE_TYPE_PRE_VOTE_RESPONSE = 2;
  MESSAGE_TYPE_REQUEST_VOTE = 3;
  MESSAGE_TYPE_REQUEST_VOTE_RESPONSE = 4;
  MESSAGE_TYPE_APPEND_ENTRIES = 6;
  MESSAGE_TYPE_APPEND_ENTRIES_RESPONSE = 7;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_NORMAL = 1;
  ENTRY_TYPE_NO_OP = 2;
}

// Entry is an immutable command or election no-op at a positive log position.
message Entry {
  uint64 term = 1;
  uint64 index = 2;
  EntryType type = 3;
  // No-op entries have no data; normal entry data is opaque to Raft.
  bytes data = 4;
}

// Message carries an election or replication message between Raft nodes.
message Message {
  MessageType type = 1;
  // Node IDs are positive; zero is not a valid sender or recipient.
  uint64 from = 2;
  uint64 to = 3;
  // For a PreVote request, term is the proposed election term.
  uint64 term = 4;
  // Vote requests carry the candidate's last log position (both zero for an empty
  // log). Replication messages leave both fields zero.
  uint64 last_log_index = 5;
  uint64 last_log_term = 6;
  // Responses set reject when a vote or append is denied.
  bool reject = 7;
  // Appends name the preceding entry (both zero at the start of the log).
  // Append responses echo prev_log_index to identify the request being answered.
  uint64 prev_log_index = 8;
  uint64 prev_log_term = 9;
  repeated Entry entries = 10;
  uint64 leader_commit = 11;
  // Successful append responses acknowledge the last index matched by the
  // request, which can be smaller than the follower's local last index.
  uint64 match_index = 12;
  // Log-prefix rejections report the conflicting term and its first index. A
  // missing preceding entry uses term zero and the follower's last index plus
  // one. Stale-term rejections leave both hints zero.
  uint64 conflict_term = 13;
  uint64 conflict_index = 14;
}
